settings:
  # Select scoreboard mode: NORMAL, WORLD, PERMISSION and WORLDGUARD
  #
  # NORMAL - Shows the scoreboard for all the players
  # WORLD - Shows the scoreboard filtering worlds
  # PERMISSION - Shows the scoreboard checking permissions
  # worldguard - Shows the scoreboard checking permissions
  mode: world
  scoreboard-interval-update: 20
  scoreboard:
    title: '&#FB0000&lW&#ED0000&li&#DE0000&lz&#D00000&lC&#C20000&lr&#B40000&la&#A50000&lf&#970000&lt'
    lines:
      - '&8&m+----------------+'
      - ''
      - '&#0D00FB&lP&#0D13F2&ll&#0D27E9&la&#0E3AE1&ly&#0E4ED8&le&#0E61CF&lr:'
      - '&f● &a&lɴɪᴄᴋ: &b%player_name%'
      - '&f● &e&lᴛɪᴍᴇ: &b%statistic_hours_played%h'
      - '&f● &4&lᴅᴇᴀᴛʜꜱ: &e%statistic_deaths%'
      - ''
      - '&#0D00FB&lS&#0D13F2&le&#0D27E9&lr&#0E3AE1&lv&#0E4ED8&le&#0E61CF&lr:'
      - '&f● &7&lᴍᴏᴅᴏ: &bSurvival'
      - '&f● &7&lᴘɪɴɢ: &b%player_ping%'
      - '&f● &7&lᴘʟᴀʏᴇʀꜱ: &b%server_online_world%'
      - ''

  #Option to disable some scoreboards from worlds
  world-blacklist:
    enabled: true
    worlds:
      - "your-world"
      - "your-world2"

#
# Tab-list system configuration
#
# Supports PlaceholderAPI
tab-list:
  enabled: false
  update-interval: 20
  header:
    - "&eShield&6Community &7| &aTest server"
    - "Do you like the plugin? Give a review!"
  footer:
    - "&6Download it now!"
    - "&fAvailable on SpigotMC"
